name: CI/release

# lint          -> ruff check + format, pyright (strict)
# rust          -> cargo fmt, clippy (-D warnings), workspace tests
# build-sdist   -> sdist, then rebuild and smoke-test a wheel from that sdist
# build-wheels  -> one abi3 (cp313) wheel per platform via cibuildwheel + maturin
# test          -> install each prebuilt wheel + run the python suite, every OS x py
# integration   -> wheel against a dockerized MonetDB (Dec2025-SP3)
# publish       -> only on a `v*` tag, via PyPI Trusted Publishing (OIDC, no token)
# github-release-> after a successful publish, create the GitHub Release

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: lint (ruff + pyright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          submodules: true
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          python-version: "3.13"
      - name: Install current stable Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      # uv sync builds the extension via maturin, so pyright checks against the real
      # _native module and installed dependencies.
      - run: uv sync --locked
      - run: uv run --no-sync ruff check .
      - run: uv run --no-sync ruff format --check .
      - run: uv run --no-sync pyright

  rust:
    name: rust fmt/clippy/test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          submodules: true
      - name: Install Rust components
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup component add rustfmt clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo clippy --manifest-path monetdb-rust/Cargo.toml --lib --all-features -- -D warnings
      - run: cargo test --manifest-path monetdb-rust/Cargo.toml --lib --all-features
      - run: ./checklicense.py --check
        working-directory: monetdb-rust

  build-sdist:
    name: build sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          submodules: true
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          python-version: "3.13"
      - name: Install current stable Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - run: uv build --sdist --out-dir dist
      - name: Rebuild and smoke-test from the sdist
        shell: bash
        run: |
          uv build dist/*.tar.gz --wheel --out-dir sdist-wheel
          wheel=$(find sdist-wheel -maxdepth 1 -name 'adbc_driver_monetdb-*.whl' -print -quit)
          wheel=$(realpath "$wheel")
          cd "$RUNNER_TEMP"
          uv run --isolated --no-project --python 3.13 --with "$wheel" \
            python -c "import adbc_driver_monetdb as m; assert m.__version__; print(m.driver_path())"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  build-wheels:
    name: build ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest      # manylinux x86_64
          - ubuntu-24.04-arm   # manylinux aarch64
          - macos-14           # macOS arm64 (Apple Silicon; Intel x86_64 intentionally unsupported)
          - windows-latest     # Windows x86_64
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          submodules: true
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
      - name: Install current stable Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: Build wheels
        uses: pypa/cibuildwheel@a0a973acdc9e7b7f8b04ac5c80e6883a5a102615 # v4.1.0
        with:
          package-dir: .
          output-dir: wheelhouse
      - name: Audit Linux wheel dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: uvx --from auditwheel auditwheel show wheelhouse/*.whl
      - name: Audit macOS wheel dependencies
        if: runner.os == 'macOS'
        shell: bash
        run: uvx --from delocate delocate-listdeps wheelhouse/*.whl
      - name: Audit Windows architecture and runtime dependencies
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $unpack = Join-Path $env:RUNNER_TEMP "adbc-wheel-audit"
          New-Item -ItemType Directory -Path $unpack | Out-Null
          $wheel = Get-ChildItem wheelhouse\*.whl | Select-Object -First 1
          tar -xf $wheel.FullName -C $unpack
          $native = Get-ChildItem $unpack -Recurse -Filter "_native*.pyd" | Select-Object -First 1
          if (-not $native) { throw "wheel contains no _native .pyd" }
          $dumpbin = Get-ChildItem "${env:ProgramFiles}\Microsoft Visual Studio\*\*\VC\Tools\MSVC\*\bin\Hostx64\x64\dumpbin.exe" |
            Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $dumpbin) { throw "dumpbin.exe was not found" }
          $headers = & $dumpbin.FullName /headers $native.FullName
          $imports = & $dumpbin.FullName /dependents $native.FullName
          $headers | Write-Output
          $imports | Write-Output
          if (-not ($headers -match "machine \(x64\)")) { throw "extension is not x86-64 PE" }
          $forbidden = $imports | Select-String -Pattern '(?i)\b(?:MSVCP|CONCRT)[^\s]*\.dll\b'
          if ($forbidden) { throw "extension unexpectedly depends on the C++ runtime: $forbidden" }
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wheels-${{ matrix.os }}
          path: wheelhouse/*.whl
          if-no-files-found: error

  test:
    name: test ${{ matrix.os }} py${{ matrix.python }}
    needs: build-wheels
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-14, windows-latest]
        python: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: wheelhouse
          name: wheels-${{ matrix.os }}
      - name: Run the suite against the installed wheel
        # NOT from the workspace: the adbc_driver_monetdb source dir at the repo root
        # would shadow the installed wheel on sys.path (no compiled _native there)
        working-directory: ${{ runner.temp }}
        shell: bash
        run: |
          wheel=$(find "$GITHUB_WORKSPACE/wheelhouse" -maxdepth 1 -name 'adbc_driver_monetdb-*.whl' -print -quit)
          uv run --isolated --no-project --python '${{ matrix.python }}' \
            --with "$wheel" --with pytest --with polars --with 'pandas>=3.0' --with 'pyarrow>=25' \
            python -m pytest "$GITHUB_WORKSPACE/tests" -m 'not integration' \
              --ignore "$GITHUB_WORKSPACE/tests/validation" -q

  integration:
    name: integration (MonetDB Dec2025)
    needs: build-wheels
    runs-on: ubuntu-latest
    services:
      monetdb:
        image: monetdb/monetdb:Dec2025-SP3@sha256:a71e6e8c8402beadc51aebf944b465ee5b185c7ae4a9e6808b5d9133ee921786
        ports:
          - 50000:50000
        env:
          MDB_DB_ADMIN_PASS: monetdb
          MDB_CREATE_DBS: test
    env:
      MONETDB_TEST_URI: monetdb://monetdb:monetdb@localhost:50000/test
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          submodules: true
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          python-version: "3.13"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: wheelhouse
          name: wheels-ubuntu-latest
      - name: Wait for MonetDB to accept connections
        shell: bash
        run: |
          uv run --isolated --no-project --python 3.13 --with pymonetdb python - <<'PY'
          import time
          import pymonetdb
          for attempt in range(60):
              try:
                  pymonetdb.connect("monetdb://monetdb:monetdb@localhost:50000/test").close()
                  print(f"MonetDB ready after {attempt + 1} attempts")
                  break
              except Exception as exc:
                  last = exc
                  time.sleep(2)
          else:
              raise SystemExit(f"MonetDB never became ready: {last}")
          PY
      - name: Run the integration suite against the installed wheel
        # NOT from the workspace: the adbc_driver_monetdb source dir at the repo root
        # would shadow the installed wheel on sys.path (no compiled _native there)
        working-directory: ${{ runner.temp }}
        shell: bash
        run: |
          wheel=$(find "$GITHUB_WORKSPACE/wheelhouse" -maxdepth 1 -name 'adbc_driver_monetdb-*.whl' -print -quit)
          uv run --isolated --no-project --python 3.13 \
            --with "$wheel" --with pytest --with polars --with 'pandas>=3.0' \
            --with pymonetdb --with 'pyarrow>=25' \
            python -m pytest "$GITHUB_WORKSPACE/tests" -m integration \
              --ignore "$GITHUB_WORKSPACE/tests/validation" -q
          uv run --isolated --no-project --python 3.13 \
            --with "$wheel" --with pytest --with pymonetdb \
            --with 'adbc-drivers-validation @ git+https://github.com/adbc-drivers/validation@20bcdbe0d498065565e727861ca7e1f94d9b66bb' \
            python -m pytest "$GITHUB_WORKSPACE/tests/validation" -q
      - name: Run monetdb-rust live protocol tests
        env:
          CI_SERVER_URL: monetdb://monetdb:monetdb@localhost:50000/test
        run: cargo test --manifest-path monetdb-rust/Cargo.toml --test ci --all-features

  publish:
    name: publish to PyPI
    needs: [lint, rust, build-sdist, build-wheels, test, integration]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: pypi               # configure the Trusted Publisher against this env
    permissions:
      id-token: write               # OIDC -> PyPI; no API token/secret is used
      contents: read                # checkout below reads pyproject.toml to guard the tag
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Verify the tag matches the pyproject version
        run: |
          version=$(grep -m1 '^version' pyproject.toml | sed -E 's/.*"([^"]+)".*/\1/')
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match pyproject version $version (expected v$version)"
            exit 1
          fi
          echo "tag $GITHUB_REF_NAME matches pyproject version $version"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          pattern: wheels-*
          merge-multiple: true
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          name: sdist
      - uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # release/v1

  github-release:
    name: create GitHub release
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create the GitHub Release with auto-generated notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes
