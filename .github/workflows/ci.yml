name: CI/release

# lint          -> ruff check + format, pyright (strict)
# rust          -> cargo fmt, clippy (-D warnings), workspace tests
# build-sdist   -> sdist, then rebuild and smoke-test a wheel from that sdist
# license-report-> dependency license roll-up used by every dbc package
# build-wheels  -> one abi3 (cp313) wheel per platform via cibuildwheel + maturin
# test          -> install each prebuilt wheel + run the python suite, every OS x py
# integration   -> wheel against a dockerized MonetDB (Dec2025-SP3)
# publish       -> only on a `v*` tag, via PyPI Trusted Publishing (OIDC, no token)
# github-release-> after a successful publish, create the GitHub Release

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: lint (ruff + pyright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          submodules: true
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          python-version: "3.13"
      - name: Install current stable Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      # uv sync builds the extension via maturin, so pyright checks against the real
      # _native module and installed dependencies.
      - run: uv sync --locked
      - run: uv run --no-sync ruff check .
      - run: uv run --no-sync ruff format --check .
      - run: uv run --no-sync pyright

  rust:
    name: rust fmt/clippy/test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          submodules: true
      - name: Install Rust components
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup component add rustfmt clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo test --locked --workspace
      - run: cargo test --all-features
        working-directory: monetdb-rust
      - name: Audit Rust dependencies
        run: |
          cargo install cargo-audit --version 0.22.2 --locked
          cargo audit --deny warnings
      - run: ./checklicense.py --check
        working-directory: monetdb-rust
      - name: Verify the NOTICE fork revision
        shell: bash
        run: |
          revision=$(git submodule status monetdb-rust | awk '{print $1}' | sed 's/^[+-]//')
          grep -F "monetdb-rust/tree/$revision" NOTICE

  license-report:
    name: dependency license report
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          submodules: true
      - name: Install current stable Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: Generate and validate the dependency license roll-up
        run: |
          cargo install cargo-about --version 0.9.1 --locked --features cli
          cargo about generate --all-features --fail --locked \
            --target aarch64-apple-darwin,aarch64-unknown-linux-gnu,x86_64-pc-windows-msvc,x86_64-unknown-linux-gnu \
            license.tpl > THIRD_PARTY_LICENSES
          test -s THIRD_PARTY_LICENSES
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dependency-licenses
          path: THIRD_PARTY_LICENSES
          if-no-files-found: error

  build-sdist:
    name: build sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          submodules: true
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          python-version: "3.13"
      - name: Install current stable Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - run: uv build --sdist --out-dir dist
      - name: Rebuild and smoke-test from the sdist
        shell: bash
        run: |
          uv build dist/*.tar.gz --wheel --out-dir sdist-wheel
          wheel=$(find sdist-wheel -maxdepth 1 -name 'adbc_driver_monetdb-*.whl' -print -quit)
          wheel=$(realpath "$wheel")
          cd "$RUNNER_TEMP"
          uv run --isolated --no-project --python 3.13 --with "$wheel" \
            python -c "import adbc_driver_monetdb as m; assert m.__version__; print(m.driver_path())"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  build-wheels:
    name: build ${{ matrix.os }}
    needs: license-report
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest      # manylinux x86_64
            dbc_platform: linux_amd64
          - os: ubuntu-24.04-arm   # manylinux aarch64
            dbc_platform: linux_arm64
          - os: macos-14           # macOS arm64 (Apple Silicon; Intel x86_64 intentionally unsupported)
            dbc_platform: macos_arm64
          - os: windows-latest     # Windows x86_64
            dbc_platform: windows_amd64
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          submodules: true
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
      - name: Install current stable Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: Build wheels
        uses: pypa/cibuildwheel@294735312765b09d24a2fbec22660ce817587d55 # v4.1.0
        with:
          package-dir: .
          output-dir: wheelhouse
      - name: Verify wheel license payload
        shell: bash
        run: |
          python - <<'PY'
          from glob import glob
          from zipfile import ZipFile
          wheels = glob("wheelhouse/*.whl")
          assert len(wheels) == 1, wheels
          with ZipFile(wheels[0]) as wheel:
              names = set(wheel.namelist())
          for suffix in (
              ".dist-info/licenses/LICENSE",
              ".dist-info/licenses/NOTICE",
              ".dist-info/licenses/monetdb-rust/LICENSE",
              "adbc_driver_monetdb/_native.pyi",
              "adbc_driver_monetdb/dbapi.pyi",
              "adbc_driver_monetdb/py.typed",
          ):
              assert any(name.endswith(suffix) for name in names), suffix
          PY
      - name: Audit Linux wheel dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: uvx --from auditwheel auditwheel show wheelhouse/*.whl
      - name: Audit macOS wheel dependencies
        if: runner.os == 'macOS'
        shell: bash
        run: uvx --from delocate delocate-listdeps wheelhouse/*.whl
      - name: Audit Windows architecture and runtime dependencies
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $unpack = Join-Path $env:RUNNER_TEMP "adbc-wheel-audit"
          New-Item -ItemType Directory -Path $unpack | Out-Null
          $wheel = Get-ChildItem wheelhouse\*.whl | Select-Object -First 1
          tar -xf $wheel.FullName -C $unpack
          $native = Get-ChildItem $unpack -Recurse -Filter "_native*.pyd" | Select-Object -First 1
          if (-not $native) { throw "wheel contains no _native .pyd" }
          $dumpbin = Get-ChildItem "${env:ProgramFiles}\Microsoft Visual Studio\*\*\VC\Tools\MSVC\*\bin\Hostx64\x64\dumpbin.exe" |
            Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $dumpbin) { throw "dumpbin.exe was not found" }
          $headers = & $dumpbin.FullName /headers $native.FullName
          $imports = & $dumpbin.FullName /dependents $native.FullName
          $headers | Write-Output
          $imports | Write-Output
          if (-not ($headers -match "machine \(x64\)")) { throw "extension is not x86-64 PE" }
          $forbidden = $imports | Select-String -Pattern '(?i)\b(?:MSVCP|CONCRT)[^\s]*\.dll\b'
          if ($forbidden) { throw "extension unexpectedly depends on the C++ runtime: $forbidden" }
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dependency-licenses
      - name: Build and load the dbc package
        shell: bash
        run: |
          wheel=$(find wheelhouse -maxdepth 1 -name 'adbc_driver_monetdb-*.whl' -print -quit)
          python packaging/dbc/build_package.py \
            --wheel "$wheel" --platform '${{ matrix.dbc_platform }}' --out-dir dbc-dist \
            --license THIRD_PARTY_LICENSES
          driver_path="$RUNNER_TEMP/adbc-drivers"
          mkdir -p "$driver_path"
          ADBC_DRIVER_PATH="$driver_path" uvx --from 'dbc==0.3.0' \
            dbc install --no-verify dbc-dist/*.tar.gz
          cd "$RUNNER_TEMP"
          ADBC_DRIVER_PATH="$driver_path" uv run --isolated --no-project --python 3.13 \
            --with 'adbc-driver-manager==1.11.0' \
            python -c 'import adbc_driver_manager as m; db = m.AdbcDatabase(driver="monetdb"); db.close()'
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wheels-${{ matrix.os }}
          path: wheelhouse/*.whl
          if-no-files-found: error
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dbc-${{ matrix.os }}
          path: dbc-dist/*.tar.gz
          if-no-files-found: error

  test:
    name: test ${{ matrix.os }} py${{ matrix.python }}
    needs: build-wheels
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-14, windows-latest]
        python: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: wheelhouse
          name: wheels-${{ matrix.os }}
      - name: Run the suite against the installed wheel
        # NOT from the workspace: the adbc_driver_monetdb source dir at the repo root
        # would shadow the installed wheel on sys.path (no compiled _native there)
        working-directory: ${{ runner.temp }}
        shell: bash
        run: |
          wheel=$(find "$GITHUB_WORKSPACE/wheelhouse" -maxdepth 1 -name 'adbc_driver_monetdb-*.whl' -print -quit)
          uv run --isolated --no-project --python '${{ matrix.python }}' \
            --with "$wheel" --with 'pytest>=9' --with 'polars>=1.42' --with 'pandas>=3.0' \
            --with 'pyarrow>=25' --with 'sqlalchemy>=2.0' \
            python -m pytest "$GITHUB_WORKSPACE/tests" -m 'not integration' \
              --ignore "$GITHUB_WORKSPACE/tests/validation" -q

  integration:
    name: integration (MonetDB Dec2025)
    needs: build-wheels
    runs-on: ubuntu-latest
    services:
      monetdb:
        image: monetdb/monetdb:Dec2025-SP3@sha256:a71e6e8c8402beadc51aebf944b465ee5b185c7ae4a9e6808b5d9133ee921786
        ports:
          - 50000:50000
        env:
          MDB_DB_ADMIN_PASS: monetdb
          MDB_CREATE_DBS: test
    env:
      MONETDB_TEST_URI: monetdb://monetdb:monetdb@localhost:50000/test
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          submodules: true
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          python-version: "3.13"
      - name: Install current stable Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: wheelhouse
          name: wheels-ubuntu-latest
      - name: Wait for MonetDB to accept connections
        shell: bash
        run: |
          uv run --isolated --no-project --python 3.13 --with pymonetdb python - <<'PY'
          import time
          import pymonetdb
          for attempt in range(60):
              try:
                  pymonetdb.connect("monetdb://monetdb:monetdb@localhost:50000/test").close()
                  print(f"MonetDB ready after {attempt + 1} attempts")
                  break
              except Exception as exc:
                  last = exc
                  time.sleep(2)
          else:
              raise SystemExit(f"MonetDB never became ready: {last}")
          PY
      - name: Run the integration suite against the installed wheel
        # NOT from the workspace: the adbc_driver_monetdb source dir at the repo root
        # would shadow the installed wheel on sys.path (no compiled _native there)
        working-directory: ${{ runner.temp }}
        shell: bash
        run: |
          test -n "$MONETDB_TEST_URI"
          wheel=$(find "$GITHUB_WORKSPACE/wheelhouse" -maxdepth 1 -name 'adbc_driver_monetdb-*.whl' -print -quit)
          uv run --isolated --no-project --python 3.13 \
            --with "$wheel" --with 'pytest>=9' --with 'polars>=1.42' --with 'pandas>=3.0' \
            --with pymonetdb --with 'pyarrow>=25' --with 'sqlalchemy>=2.0' \
            python -m pytest "$GITHUB_WORKSPACE/tests" -m integration \
              --ignore "$GITHUB_WORKSPACE/tests/validation" -q
          uv run --isolated --no-project --python 3.13 \
            --with "$wheel" --with pytest --with pymonetdb \
            --with 'adbc-drivers-validation @ git+https://github.com/adbc-drivers/validation@a4019a3f44ccffcbec4b5203531a88259d588257' \
            python -m pytest "$GITHUB_WORKSPACE/tests/validation" -q \
              -o junit_family=xunit1 -o junit_suite_name=validation \
              --junit-xml="$RUNNER_TEMP/validation-report.xml"
      - name: Generate the validation documentation page
        shell: bash
        run: |
          cd "$GITHUB_WORKSPACE"
          PYTHONPATH="$GITHUB_WORKSPACE/tests" uv run --isolated --no-project --python 3.13 \
            --with 'adbc-drivers-validation @ git+https://github.com/adbc-drivers/validation@a4019a3f44ccffcbec4b5203531a88259d588257' \
            python -m validation.generate_documentation \
              --report "$RUNNER_TEMP/validation-report.xml" --output generated
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: documentation
          path: generated/monetdb.md
          if-no-files-found: error

  integration-arm:
    name: integration arm64 (MonetDB Dec2025)
    needs: build-wheels
    runs-on: ubuntu-24.04-arm
    services:
      monetdb:
        image: monetdb/monetdb:Dec2025-SP3@sha256:a71e6e8c8402beadc51aebf944b465ee5b185c7ae4a9e6808b5d9133ee921786
        ports:
          - 50000:50000
        env:
          MDB_DB_ADMIN_PASS: monetdb
          MDB_CREATE_DBS: test
    env:
      MONETDB_TEST_URI: monetdb://monetdb:monetdb@localhost:50000/test
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          python-version: "3.13"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: wheelhouse
          name: wheels-ubuntu-24.04-arm
      - name: Wait for MonetDB to accept connections
        shell: bash
        run: |
          uv run --isolated --no-project --python 3.13 --with pymonetdb python - <<'PY'
          import time
          import pymonetdb
          for attempt in range(60):
              try:
                  pymonetdb.connect("monetdb://monetdb:monetdb@localhost:50000/test").close()
                  print(f"MonetDB ready after {attempt + 1} attempts")
                  break
              except Exception as exc:
                  last = exc
                  time.sleep(2)
          else:
              raise SystemExit(f"MonetDB never became ready: {last}")
          PY
      - name: Run integration and validation on arm64
        working-directory: ${{ runner.temp }}
        shell: bash
        run: |
          wheel=$(find "$GITHUB_WORKSPACE/wheelhouse" -maxdepth 1 -name 'adbc_driver_monetdb-*.whl' -print -quit)
          uv run --isolated --no-project --python 3.13 \
            --with "$wheel" --with 'pytest>=9' --with 'polars>=1.42' --with 'pandas>=3.0' \
            --with pymonetdb --with 'pyarrow>=25' --with 'sqlalchemy>=2.0' \
            python -m pytest "$GITHUB_WORKSPACE/tests" -m integration \
              --ignore "$GITHUB_WORKSPACE/tests/validation" -q
          uv run --isolated --no-project --python 3.13 \
            --with "$wheel" --with pytest --with pymonetdb \
            --with 'adbc-drivers-validation @ git+https://github.com/adbc-drivers/validation@a4019a3f44ccffcbec4b5203531a88259d588257' \
            python -m pytest "$GITHUB_WORKSPACE/tests/validation" -q

  publish:
    name: publish to PyPI
    needs: [lint, rust, build-sdist, build-wheels, test, integration, integration-arm]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: pypi               # configure the Trusted Publisher against this env
    permissions:
      id-token: write               # OIDC -> PyPI; no API token/secret is used
      contents: read                # checkout below reads pyproject.toml to guard the tag
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Verify the tag matches the pyproject version
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          import tomllib

          root = Path.cwd()
          project = tomllib.loads((root / "pyproject.toml").read_text())["project"]["version"]
          cargo = tomllib.loads((root / "Cargo.toml").read_text())["workspace"]["package"]["version"]
          manifests = {
              path.name: tomllib.loads(path.read_text())["version"]
              for path in (root / "packaging" / "dbc").glob("MANIFEST.*.toml")
          }
          versions = {"pyproject.toml": project, "Cargo.toml": cargo, **manifests}
          mismatches = {name: value for name, value in versions.items() if value != project}
          expected_tag = f"v{project}"
          if mismatches or os.environ["GITHUB_REF_NAME"] != expected_tag:
              raise SystemExit(
                  f"release versions/tag disagree: versions={versions}, "
                  f"tag={os.environ['GITHUB_REF_NAME']!r}, expected={expected_tag!r}"
              )
          print(f"tag {expected_tag} matches every release version")
          PY
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          pattern: wheels-*
          merge-multiple: true
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          name: sdist
      - uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # release/v1

  github-release:
    name: create GitHub release
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: release/wheels
          pattern: wheels-*
          merge-multiple: true
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: release/sdist
          name: sdist
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: release/dbc
          pattern: dbc-*
          merge-multiple: true
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: release/docs
          name: documentation
      - name: Create the GitHub Release with auto-generated notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --verify-tag --generate-notes \
            release/wheels/*.whl release/sdist/*.tar.gz release/dbc/*.tar.gz release/docs/monetdb.md
