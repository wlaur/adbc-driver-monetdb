name: CI/release

# lint          -> ruff check + format, pyright (strict)
# rust          -> cargo fmt, clippy (-D warnings), workspace tests
# rust-platform -> workspace tests on macOS and Windows
# big-endian    -> compile the Arrow wire layer for s390x
# build-sdist   -> sdist, then rebuild and smoke-test a wheel from that sdist
# license-report-> dependency license roll-up used by every Python and dbc package
# build-wheels  -> one abi3 (cp313) wheel per platform via cibuildwheel + maturin
# test          -> install each prebuilt wheel + run the python suite, every OS x py
# integration   -> x86_64 wheels against MonetDB Dec2025-SP3
# downstream-dialect -> run the SQLAlchemy dialect against the candidate wheel
# integration-minimum -> x86_64 wheel against the minimum MonetDB 11.55.1
# integration-arm -> ARM64 wheel against MonetDB Dec2025
# publish       -> only on a `v*` tag, via PyPI Trusted Publishing (OIDC, no token)
# github-release-> after a successful publish, create the GitHub Release

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: lint (ruff + pyright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          submodules: true
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          python-version: "3.13"
      - name: Install current stable Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      # uv sync builds the extension via maturin, so pyright checks against the real
      # _native module and installed dependencies.
      - run: uv sync --locked
      - run: uv run --no-sync ruff check .
      - run: uv run --no-sync ruff format --check .
      - run: uv run --no-sync pyright

  rust:
    name: rust fmt/clippy/test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          submodules: true
      - name: Install Rust components
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup component add rustfmt clippy
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo test --locked --workspace
      - run: cargo test --all-features --lib
        working-directory: monetdb-rust
      - run: cargo test --all-features --doc
        working-directory: monetdb-rust
      - name: Audit Rust dependencies
        run: |
          cargo install cargo-audit --version 0.22.2 --locked
          cargo audit --deny warnings
      - run: ./checklicense.py --check
        working-directory: monetdb-rust
      - name: Verify the NOTICE fork revision
        shell: bash
        run: |
          revision=$(git submodule status monetdb-rust | awk '{print $1}' | sed 's/^[+-]//')
          grep -F "monetdb-rust/tree/$revision" NOTICE

  rust-platform:
    name: rust platform (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-latest]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          submodules: true
      - name: Install current stable Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - run: cargo test --locked --workspace

  big-endian:
    name: big-endian Arrow check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          submodules: true
      - name: Install current stable Rust and s390x target
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add s390x-unknown-linux-gnu
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - run: cargo check --locked -p monetdb-arrow --target s390x-unknown-linux-gnu

  license-report:
    name: dependency license report
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          submodules: true
      - name: Install current stable Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - name: Generate and validate the dependency license roll-up
        run: |
          cargo install cargo-about --version 0.9.1 --locked --features cli
          python3 packaging/generate_licenses.py
          test -s THIRD_PARTY_LICENSES
          git diff --exit-code -- THIRD_PARTY_LICENSES
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dependency-licenses
          path: THIRD_PARTY_LICENSES
          if-no-files-found: error

  build-sdist:
    name: build sdist
    needs: license-report
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          submodules: true
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          python-version: "3.13"
      - name: Install current stable Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dependency-licenses
      - run: uv build --sdist --out-dir dist
      - name: Verify the sdist release payload
        shell: bash
        run: |
          python - <<'PY'
          import tarfile
          from glob import glob
          sdists = glob("dist/*.tar.gz")
          assert len(sdists) == 1, sdists
          with tarfile.open(sdists[0]) as archive:
              names = archive.getnames()
          for suffix in (
              "/THIRD_PARTY_LICENSES",
              "/tests/conftest.py",
              "/packaging/dbc/MANIFEST.linux.toml",
          ):
              assert any(name.endswith(suffix) for name in names), suffix
          assert not any("/__pycache__/" in name or name.endswith(".pyc") for name in names), names
          PY
      - name: Rebuild and smoke-test from the sdist
        shell: bash
        run: |
          uv build dist/*.tar.gz --wheel --out-dir sdist-wheel
          wheel=$(find sdist-wheel -maxdepth 1 -name 'adbc_driver_monetdb-*.whl' -print -quit)
          python - "$wheel" <<'PY'
          import sys
          from zipfile import ZipFile
          with ZipFile(sys.argv[1]) as archive:
              names = archive.namelist()
          for suffix in (
              ".dist-info/licenses/LICENSE",
              ".dist-info/licenses/NOTICE",
              ".dist-info/licenses/THIRD_PARTY_LICENSES",
              ".dist-info/licenses/monetdb-rust/LICENSE",
          ):
              assert any(name.endswith(suffix) for name in names), suffix
          PY
          wheel=$(realpath "$wheel")
          cd "$RUNNER_TEMP"
          uv run --isolated --no-project --python 3.13 --with "$wheel" \
            python -c "import adbc_driver_monetdb as m; import adbc_driver_monetdbs.dbapi; assert m.__version__; print(m.driver_path())"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  build-wheels:
    name: build ${{ matrix.os }}
    needs: license-report
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest      # manylinux x86_64
            dbc_platform: linux_amd64
          - os: ubuntu-24.04-arm   # manylinux aarch64
            dbc_platform: linux_arm64
          - os: macos-14           # macOS arm64 (Apple Silicon; Intel x86_64 intentionally unsupported)
            dbc_platform: macos_arm64
          - os: windows-latest     # Windows x86_64
            dbc_platform: windows_amd64
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          submodules: true
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
      - name: Install current stable Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dependency-licenses
      - name: Build wheels
        uses: pypa/cibuildwheel@294735312765b09d24a2fbec22660ce817587d55 # v4.1.0
        with:
          package-dir: .
          output-dir: wheelhouse
      - name: Verify wheel license payload
        shell: bash
        run: |
          python - <<'PY'
          from glob import glob
          from zipfile import ZipFile
          wheels = glob("wheelhouse/*.whl")
          assert len(wheels) == 1, wheels
          with ZipFile(wheels[0]) as wheel:
              names = set(wheel.namelist())
          for suffix in (
              ".dist-info/licenses/LICENSE",
              ".dist-info/licenses/NOTICE",
              ".dist-info/licenses/THIRD_PARTY_LICENSES",
              ".dist-info/licenses/monetdb-rust/LICENSE",
              "adbc_driver_monetdb/_native.pyi",
              "adbc_driver_monetdb/dbapi.pyi",
              "adbc_driver_monetdb/py.typed",
              "adbc_driver_monetdbs/__init__.py",
              "adbc_driver_monetdbs/dbapi.py",
              "adbc_driver_monetdbs/py.typed",
          ):
              assert any(name.endswith(suffix) for name in names), suffix
          PY
      - name: Verify the Linux dbc driver built inside manylinux
        if: runner.os == 'Linux'
        shell: bash
        run: test -f wheelhouse/standalone-dbc/libadbc_monetdb.so
      - name: Build the macOS dbc driver without Python
        if: runner.os == 'macOS'
        run: cargo build --locked --release -p adbc-monetdb --no-default-features
      - name: Build the Windows dbc driver without Python and with a static CRT
        if: runner.os == 'Windows'
        env:
          RUSTFLAGS: -C target-feature=+crt-static
        run: cargo build --locked --release -p adbc-monetdb --no-default-features
      - name: Audit Linux wheel dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          uvx --from 'auditwheel==6.7.0' auditwheel show wheelhouse/*.whl
          library=wheelhouse/standalone-dbc/libadbc_monetdb.so
          readelf -h -d "$library"
          ldd "$library"
          nm -D --defined-only "$library" | grep -F AdbcDriverMonetdbInit
          if nm -D --undefined-only "$library" | grep -E '(^|[[:space:]])_?Py[A-Za-z0-9_]*$'; then
            echo "standalone dbc driver imports Python runtime symbols" >&2
            exit 1
          fi
          max_glibc=$(
            readelf --version-info "$library" |
              sed -n 's/.*Name: GLIBC_\([0-9.]*\).*/\1/p' |
              sort -V |
              tail -1
          )
          if [ -z "$max_glibc" ] || [ "$(printf '%s\n' "$max_glibc" 2.28 | sort -V | tail -1)" != 2.28 ]; then
            echo "standalone dbc driver requires GLIBC_${max_glibc:-unknown}, newer than GLIBC_2.28" >&2
            exit 1
          fi
      - name: Audit macOS wheel dependencies
        if: runner.os == 'macOS'
        shell: bash
        run: |
          uvx --from 'delocate==0.13.0' delocate-listdeps wheelhouse/*.whl
          library=target/release/libadbc_monetdb.dylib
          otool -hv -L "$library"
          nm -gU "$library" | grep -F AdbcDriverMonetdbInit
          if nm -u "$library" | grep -E '(^|[[:space:]])_?Py[A-Za-z0-9_]*$'; then
            echo "standalone dbc driver imports Python runtime symbols" >&2
            exit 1
          fi
      - name: Audit Windows architecture and runtime dependencies
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $unpack = Join-Path $env:RUNNER_TEMP "adbc-wheel-audit"
          New-Item -ItemType Directory -Path $unpack | Out-Null
          $wheel = Get-ChildItem wheelhouse\*.whl | Select-Object -First 1
          tar -xf $wheel.FullName -C $unpack
          $native = Get-ChildItem $unpack -Recurse -Filter "_native*.pyd" | Select-Object -First 1
          if (-not $native) { throw "wheel contains no _native .pyd" }
          $dumpbin = Get-ChildItem "${env:ProgramFiles}\Microsoft Visual Studio\*\*\VC\Tools\MSVC\*\bin\Hostx64\x64\dumpbin.exe" |
            Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $dumpbin) { throw "dumpbin.exe was not found" }
          $headers = & $dumpbin.FullName /headers $native.FullName
          $imports = & $dumpbin.FullName /dependents $native.FullName
          $dbc = Resolve-Path target\release\adbc_monetdb.dll
          $dbcHeaders = & $dumpbin.FullName /headers $dbc
          $dbcImports = & $dumpbin.FullName /dependents $dbc
          $dbcExports = & $dumpbin.FullName /exports $dbc
          $headers | Write-Output
          $imports | Write-Output
          $dbcHeaders | Write-Output
          $dbcImports | Write-Output
          $dbcExports | Write-Output
          if (-not ($headers -match "machine \(x64\)")) { throw "extension is not x86-64 PE" }
          if (-not ($dbcHeaders -match "machine \(x64\)")) { throw "dbc driver is not x86-64 PE" }
          if (-not ($dbcExports -match "AdbcDriverMonetdbInit")) { throw "dbc driver has no ADBC entrypoint" }
          if ($dbcImports -match '(?i)python3[0-9]*\.dll') { throw "dbc driver imports the Python runtime" }
          if ($dbcImports -match '(?i)\b(?:VCRUNTIME|MSVCP|CONCRT)[^\s]*\.dll\b') {
            throw "dbc driver unexpectedly depends on the dynamic Visual C++ runtime"
          }
          $forbidden = $imports | Select-String -Pattern '(?i)\b(?:MSVCP|CONCRT)[^\s]*\.dll\b'
          if ($forbidden) { throw "extension unexpectedly depends on the C++ runtime: $forbidden" }
      - name: Build and load the dbc package
        shell: bash
        run: |
          case '${{ runner.os }}' in
            Linux) library=wheelhouse/standalone-dbc/libadbc_monetdb.so ;;
            macOS) library=target/release/libadbc_monetdb.dylib ;;
            Windows)
              library=target/release/adbc_monetdb.dll
              export RUSTFLAGS='-C target-feature=+crt-static'
              ;;
          esac
          python packaging/dbc/build_package.py \
            --library "$library" --platform '${{ matrix.dbc_platform }}' --out-dir dbc-dist \
            --license THIRD_PARTY_LICENSES
          cargo run --locked --release --no-default-features \
            -p adbc-monetdb --example dbc_smoke -- "$library"
          driver_path="$RUNNER_TEMP/adbc-drivers"
          mkdir -p "$driver_path"
          ADBC_DRIVER_PATH="$driver_path" uvx --from 'dbc==0.3.0' \
            dbc install --no-verify dbc-dist/*.tar.gz
          cd "$RUNNER_TEMP"
          ADBC_DRIVER_PATH="$driver_path" uv run --isolated --no-project --python 3.13 \
            --with 'adbc-driver-manager==1.11.0' \
            python -c 'import adbc_driver_manager as m; db = m.AdbcDatabase(driver="monetdb"); db.close()'
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wheels-${{ matrix.os }}
          path: wheelhouse/*.whl
          if-no-files-found: error
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dbc-${{ matrix.os }}
          path: dbc-dist/*.tar.gz
          if-no-files-found: error

  test:
    name: test ${{ matrix.os }} py${{ matrix.python }}
    needs: build-wheels
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-14, windows-latest]
        python: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: wheelhouse
          name: wheels-${{ matrix.os }}
      - name: Run the suite against the installed wheel
        # NOT from the workspace: the adbc_driver_monetdb source dir at the repo root
        # would shadow the installed wheel on sys.path (no compiled _native there)
        working-directory: ${{ runner.temp }}
        shell: bash
        run: |
          wheel=$(find "$GITHUB_WORKSPACE/wheelhouse" -maxdepth 1 -name 'adbc_driver_monetdb-*.whl' -print -quit)
          uv run --isolated --no-project --python '${{ matrix.python }}' \
            --with "$wheel" --with 'pytest>=9' --with 'polars>=1.42' --with 'pandas>=3.0' \
            --with pymonetdb --with 'pyarrow>=25' --with 'sqlalchemy>=2.0' --with cryptography \
            python -m pytest "$GITHUB_WORKSPACE/tests" -m 'not integration and not local_only' \
              --ignore "$GITHUB_WORKSPACE/tests/validation" -q

  integration:
    name: integration (MonetDB Dec2025)
    needs: build-wheels
    runs-on: ubuntu-latest
    services:
      monetdb:
        # The x86_64 wheel must use the amd64 service. Local Compose and the ARM64
        # integration job use the native wlaur/monetdb-container image.
        image: monetdb/monetdb:Dec2025-SP3@sha256:a71e6e8c8402beadc51aebf944b465ee5b185c7ae4a9e6808b5d9133ee921786
        ports:
          - 50000:50000
        env:
          MDB_DB_ADMIN_PASS: monetdb
          MDB_CREATE_DBS: test
    env:
      MONETDB_TEST_URI: monetdb://monetdb:monetdb@localhost:50000/test
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          submodules: true
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          python-version: "3.13"
      - name: Install current stable Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: wheelhouse
          name: wheels-ubuntu-latest
      - name: Wait for MonetDB to accept connections
        shell: bash
        run: |
          uv run --isolated --no-project --python 3.13 --with pymonetdb python - <<'PY'
          import time
          import pymonetdb
          for attempt in range(60):
              try:
                  pymonetdb.connect("monetdb://monetdb:monetdb@localhost:50000/test").close()
                  print(f"MonetDB ready after {attempt + 1} attempts")
                  break
              except Exception as exc:
                  last = exc
                  time.sleep(2)
          else:
              raise SystemExit(f"MonetDB never became ready: {last}")
          PY
      - name: Run the monetdb-rust integration suite
        working-directory: monetdb-rust
        env:
          CI_SERVER_URL: "monetdb://localhost:50000/test?user=monetdb&password=monetdb"
        run: cargo test --all-features --test ci
      - name: Run the integration suite against the installed wheel
        # NOT from the workspace: the adbc_driver_monetdb source dir at the repo root
        # would shadow the installed wheel on sys.path (no compiled _native there)
        working-directory: ${{ runner.temp }}
        shell: bash
        run: |
          test -n "$MONETDB_TEST_URI"
          wheel=$(find "$GITHUB_WORKSPACE/wheelhouse" -maxdepth 1 -name 'adbc_driver_monetdb-*.whl' -print -quit)
          uv run --isolated --no-project --python 3.13 \
            --with "$wheel" --with 'pytest>=9' --with 'polars>=1.42' --with 'pandas>=3.0' \
            --with pymonetdb --with 'pyarrow>=25' --with 'sqlalchemy>=2.0' --with cryptography \
            python -m pytest "$GITHUB_WORKSPACE/tests" -m 'integration and not local_only' \
              --ignore "$GITHUB_WORKSPACE/tests/validation" -q
          uv run --isolated --no-project --python 3.13 \
            --with "$wheel" --with pytest --with pymonetdb \
            --with 'adbc-drivers-validation @ git+https://github.com/adbc-drivers/validation@a4019a3f44ccffcbec4b5203531a88259d588257' \
            python -m pytest "$GITHUB_WORKSPACE/tests/validation" -q \
              -o junit_family=xunit1 -o junit_suite_name=validation \
              --junit-xml="$RUNNER_TEMP/validation-report.xml"
      - name: Generate the validation documentation page
        shell: bash
        run: |
          cd "$GITHUB_WORKSPACE"
          PYTHONPATH="$GITHUB_WORKSPACE/tests" uv run --isolated --no-project --python 3.13 \
            --with 'adbc-drivers-validation @ git+https://github.com/adbc-drivers/validation@a4019a3f44ccffcbec4b5203531a88259d588257' \
            python -m validation.generate_documentation \
              --report "$RUNNER_TEMP/validation-report.xml" --output generated
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: documentation
          path: generated/monetdb.md
          if-no-files-found: error

  downstream-dialect:
    name: downstream SQLAlchemy dialect
    needs: build-wheels
    runs-on: ubuntu-latest
    services:
      monetdb:
        image: monetdb/monetdb:Dec2025-SP3@sha256:a71e6e8c8402beadc51aebf944b465ee5b185c7ae4a9e6808b5d9133ee921786
        ports:
          - 50000:50000
        env:
          MDB_DB_ADMIN_PASS: monetdb
          MDB_CREATE_DBS: test
    env:
      MONETDB_TEST_URI: monetdb://monetdb:monetdb@localhost:50000/test
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: wlaur/sqlalchemy-monetdb-adbc
          path: downstream-dialect
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          python-version: "3.13"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: wheelhouse
          name: wheels-ubuntu-latest
      - name: Run downstream unit and integration tests with this wheel
        working-directory: downstream-dialect
        shell: bash
        run: |
          wheel=$(find "$GITHUB_WORKSPACE/wheelhouse" -maxdepth 1 -name 'adbc_driver_monetdb-*.whl' -print -quit)
          uv sync --locked
          uv run --no-sync --with "$wheel" \
            python -c "import adbc_driver_monetdb as d; print(d.__version__, d.driver_path())"
          uv run --no-sync --with "$wheel" pytest -q

  integration-minimum:
    name: integration minimum (MonetDB 11.55.1)
    needs: build-wheels
    runs-on: ubuntu-latest
    services:
      monetdb:
        # wlaur/monetdb-container starts at 11.55.7; keep the official amd64
        # image for the required 11.55.1 lower-bound check.
        image: monetdb/monetdb:Dec2025@sha256:2d85475cd9324de70a5f6f14326918d39aa924862e9719d3ca87978cd8dd44ef
        ports:
          - 50000:50000
        env:
          MDB_DB_ADMIN_PASS: monetdb
          MDB_CREATE_DBS: test
    env:
      MONETDB_TEST_URI: monetdb://monetdb:monetdb@localhost:50000/test
      MONETDB_EXPECTED_SERVER_VERSION: 11.55.1
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          submodules: true
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          python-version: "3.13"
      - name: Install current stable Rust
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: wheelhouse
          name: wheels-ubuntu-latest
      - name: Wait for MonetDB to accept connections
        shell: bash
        run: |
          uv run --isolated --no-project --python 3.13 --with pymonetdb python - <<'PY'
          import time
          import pymonetdb
          for attempt in range(60):
              try:
                  pymonetdb.connect("monetdb://monetdb:monetdb@localhost:50000/test").close()
                  print(f"MonetDB ready after {attempt + 1} attempts")
                  break
              except Exception as exc:
                  last = exc
                  time.sleep(2)
          else:
              raise SystemExit(f"MonetDB never became ready: {last}")
          PY
      - name: Run the monetdb-rust integration suite
        shell: bash
        working-directory: monetdb-rust
        env:
          CI_SERVER_URL: "monetdb://localhost:50000/test?user=monetdb&password=monetdb"
        run: cargo test --all-features --test ci
      - name: Run the suites against the installed minimum-version wheel
        shell: bash
        working-directory: ${{ runner.temp }}
        run: |
          wheel=$(find "$GITHUB_WORKSPACE/wheelhouse" -maxdepth 1 -name 'adbc_driver_monetdb-*.whl' -print -quit)
          uv run --isolated --no-project --python 3.13 \
            --with "$wheel" --with 'pytest>=9' --with 'polars>=1.42' --with 'pandas>=3.0' \
            --with pymonetdb --with 'pyarrow>=25' --with 'sqlalchemy>=2.0' --with cryptography \
            python -m pytest "$GITHUB_WORKSPACE/tests" -m 'integration and not local_only' \
              --ignore "$GITHUB_WORKSPACE/tests/validation" -q
          uv run --isolated --no-project --python 3.13 \
            --with "$wheel" --with pytest --with pymonetdb \
            --with 'adbc-drivers-validation @ git+https://github.com/adbc-drivers/validation@a4019a3f44ccffcbec4b5203531a88259d588257' \
            python -m pytest "$GITHUB_WORKSPACE/tests/validation" -q

  integration-arm:
    name: integration arm64 (MonetDB Dec2025)
    needs: build-wheels
    runs-on: ubuntu-24.04-arm
    services:
      monetdb:
        # Native ARM64 image recipe: https://github.com/wlaur/monetdb-container
        image: wlaur/monetdb-container:11.55.7-2@sha256:22dd41bd10fd7136ca1ef6afaec5cf0c1670f16a84b80785a5fee12aac480eb4
        ports:
          - 50000:50000
        env:
          MDB_DB_ADMIN_PASS: monetdb
          MDB_CREATE_DBS: test
    env:
      MONETDB_TEST_URI: monetdb://monetdb:monetdb@localhost:50000/test
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          submodules: true
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          python-version: "3.13"
      - name: Install current stable Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: wheelhouse
          name: wheels-ubuntu-24.04-arm
      - name: Verify the MonetDB service is native ARM64
        env:
          SERVICE_CONTAINER: ${{ job.services.monetdb.id }}
        shell: bash
        run: |
          image_id=$(docker inspect --format '{{.Image}}' "$SERVICE_CONTAINER")
          platform=$(docker image inspect --format '{{.Os}}/{{.Architecture}}' "$image_id")
          test "$platform" = linux/arm64
          test "$(docker exec "$SERVICE_CONTAINER" uname -m)" = aarch64
      - name: Wait for MonetDB to accept connections
        shell: bash
        run: |
          uv run --isolated --no-project --python 3.13 --with pymonetdb python - <<'PY'
          import time
          import pymonetdb
          for attempt in range(60):
              try:
                  pymonetdb.connect("monetdb://monetdb:monetdb@localhost:50000/test").close()
                  print(f"MonetDB ready after {attempt + 1} attempts")
                  break
              except Exception as exc:
                  last = exc
                  time.sleep(2)
          else:
              raise SystemExit(f"MonetDB never became ready: {last}")
          PY
      - name: Run the monetdb-rust integration suite
        working-directory: monetdb-rust
        env:
          CI_SERVER_URL: "monetdb://localhost:50000/test?user=monetdb&password=monetdb"
        run: cargo test --all-features --test ci
      - name: Run the integration suite against the installed ARM64 wheel
        working-directory: ${{ runner.temp }}
        shell: bash
        run: |
          test -n "$MONETDB_TEST_URI"
          wheel=$(find "$GITHUB_WORKSPACE/wheelhouse" -maxdepth 1 -name 'adbc_driver_monetdb-*.whl' -print -quit)
          uv run --isolated --no-project --python 3.13 \
            --with "$wheel" --with 'pytest>=9' --with 'polars>=1.42' --with 'pandas>=3.0' \
            --with pymonetdb --with 'pyarrow>=25' --with 'sqlalchemy>=2.0' --with cryptography \
            python -m pytest "$GITHUB_WORKSPACE/tests" -m 'integration and not local_only' \
              --ignore "$GITHUB_WORKSPACE/tests/validation" -q
      - name: Run the validation suite against the installed ARM64 wheel
        working-directory: ${{ runner.temp }}
        shell: bash
        run: |
          wheel=$(find "$GITHUB_WORKSPACE/wheelhouse" -maxdepth 1 -name 'adbc_driver_monetdb-*.whl' -print -quit)
          uv run --isolated --no-project --python 3.13 \
            --with "$wheel" --with pytest --with pymonetdb \
            --with 'adbc-drivers-validation @ git+https://github.com/adbc-drivers/validation@a4019a3f44ccffcbec4b5203531a88259d588257' \
            python -m pytest "$GITHUB_WORKSPACE/tests/validation" -q

  publish:
    name: publish to PyPI
    needs:
      [
        lint,
        rust,
        rust-platform,
        big-endian,
        build-sdist,
        build-wheels,
        test,
        integration,
        downstream-dialect,
        integration-minimum,
        integration-arm,
      ]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: pypi               # configure the Trusted Publisher against this env
    permissions:
      id-token: write               # OIDC -> PyPI; no API token/secret is used
      contents: read                # checkout below reads pyproject.toml to guard the tag
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - name: Verify protected-main provenance and release versions
        run: |
          git fetch origin main --no-tags
          python packaging/release_checks.py provenance \
            --tag "$GITHUB_REF_NAME" --commit "$GITHUB_SHA" --main-ref origin/main
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          pattern: wheels-*
          merge-multiple: true
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          name: sdist
      - name: Verify the complete PyPI artifact set
        run: python packaging/release_checks.py publish-artifacts dist --version "${GITHUB_REF_NAME#v}"
      - uses: pypa/gh-action-pypi-publish@ba38be9e461d3875417946c167d0b5f3d385a247 # v1.14.1

  github-release:
    name: create GitHub release
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: release/python
          pattern: wheels-*
          merge-multiple: true
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: release/python
          name: sdist
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: release/dbc
          pattern: dbc-*
          merge-multiple: true
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: release/docs
          name: documentation
      - name: Create the GitHub Release with checksums and auto-generated notes
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python packaging/release_checks.py github-checksums release
          python packaging/release_checks.py github-artifacts release --version "${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --verify-tag --generate-notes \
            release/python/*.whl release/python/*.tar.gz release/dbc/*.tar.gz \
            release/docs/monetdb.md release/SHA256SUMS
