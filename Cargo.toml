[workspace]
resolver = "3"
members = ["crates/monetdb-arrow", "crates/adbc-monetdb"]
# The monetdb-rust fork (git submodule of wlaur/monetdb-rust) keeps its own
# workspace; it is consumed as a path dependency, not as a member.
exclude = ["monetdb-rust"]

[workspace.package]
version = "0.12.4"
edition = "2024"
license = "MIT"
repository = "https://github.com/wlaur/adbc-driver-monetdb"

[workspace.dependencies]
# ADBC 0.23 backport: expose known affected-row counts alongside query streams.
# Remove the git pin when this capability is available in a crates.io release.
adbc_core = { git = "https://github.com/wlaur/arrow-adbc", rev = "5fc505640f1c445f5c5c315fc8377ab79cbe566c" }
adbc_ffi = { git = "https://github.com/wlaur/arrow-adbc", rev = "5fc505640f1c445f5c5c315fc8377ab79cbe566c" }
# adbc_core/adbc_ffi 0.23 require arrow >=53.1,<59 -- one arrow major per workspace
arrow-array = "58"
arrow-buffer = "58"
arrow-data = "58"
arrow-schema = "58"
arrow-select = "58"
chrono = "0.4"
libc = "0.2"
memchr = "2"
memmap2 = "0.9"
lz4_flex = "0.13"
monetdb = { path = "monetdb-rust" }
monetdb-arrow = { path = "crates/monetdb-arrow" }
pyo3 = "0.29"
percent-encoding = "2"
rayon = "1"
url = "2.5"
uuid = "1"

[workspace.lints.rust]
# require `unsafe {}` inside an `unsafe fn` body (no implicit unsafe scope)
unsafe_op_in_unsafe_fn = "warn"

[workspace.lints.clippy]
# every `unsafe {}` block must carry a `// SAFETY:` comment
undocumented_unsafe_blocks = "warn"

# Size-optimized release: the cdylib statically links arrow, so LTO prunes a lot of
# unused code and strip drops debug symbols (the wheel is mostly this library).
[profile.release]
strip = true
lto = true
codegen-units = 1
