services:
  monetdb:
    # Native ARM64 Dec2025-SP3 image recipe: https://github.com/wlaur/monetdb-container
    image: wlaur/monetdb-container:11.55.7-2@sha256:22dd41bd10fd7136ca1ef6afaec5cf0c1670f16a84b80785a5fee12aac480eb4
    platform: linux/arm64
    ports:
      - "50000:50000"
    environment:
      MDB_DB_ADMIN_PASS: monetdb
      MDB_CREATE_DBS: test
    tmpfs:
      - /var/monetdb5/dbfarm:rw,size=${MONETDB_DISK_LIMIT:-4g},mode=0777

  monetdb-remote:
    image: wlaur/monetdb-container:11.55.7-2@sha256:22dd41bd10fd7136ca1ef6afaec5cf0c1670f16a84b80785a5fee12aac480eb4
    platform: linux/arm64
    ports:
      - "50002:50000"
    environment:
      MDB_DB_ADMIN_PASS: monetdb
      MDB_CREATE_DBS: remote
    tmpfs:
      - /var/monetdb5/dbfarm:rw,size=${MONETDB_DISK_LIMIT:-4g},mode=0777

  toxiproxy:
    image: ghcr.io/shopify/toxiproxy:2.12.0@sha256:9378ed52a28bc50edc1350f936f518f31fa95f0d15917d6eb40b8e376d1a214e
    command: ["-host", "0.0.0.0", "-config", "/config/toxiproxy.json"]
    ports:
      - "8474:8474"
      - "50003:50001"
    volumes:
      - ./tests/toxiproxy.json:/config/toxiproxy.json:ro
