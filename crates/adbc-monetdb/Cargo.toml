[package]
name = "adbc-monetdb"
description = "ADBC driver for MonetDB"
publish = false
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
crate-type = ["lib", "cdylib"]

[features]
default = []
# built by maturin (see /pyproject.toml): adds the stub pyo3 extension module so the
# cdylib is shipped inside the Python wheel as adbc_driver_monetdb._native
python = ["dep:pyo3", "pyo3/extension-module", "pyo3/abi3-py313"]

[dependencies]
adbc_core.workspace = true
adbc_ffi.workspace = true
arrow-array.workspace = true
arrow-schema.workspace = true
arrow-select.workspace = true
chrono.workspace = true
lz4_flex.workspace = true
memmap2.workspace = true
monetdb = { workspace = true, features = ["rustls"] }
monetdb-arrow.workspace = true
pyo3 = { workspace = true, optional = true }
percent-encoding.workspace = true
url.workspace = true

[build-dependencies]
cargo-lock = "11"

[dev-dependencies]
arrow-buffer.workspace = true
libloading = "0.9"
proptest = "1"

[lints]
workspace = true
