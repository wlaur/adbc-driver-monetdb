[project]
name = "adbc-driver-monetdb"
version = "0.8.3"
description = "ADBC driver for MonetDB: Arrow-native reads and writes for polars, pandas, and the wider ADBC ecosystem"
authors = [{ name = "William Laurén", email = "lauren.william.a@gmail.com" }]
requires-python = ">=3.13"
readme = "README.md"
license = "MIT AND MPL-2.0"
license-files = ["LICENSE", "NOTICE", "THIRD_PARTY_LICENSES", "monetdb-rust/LICENSE"]
keywords = ["monetdb", "adbc", "arrow", "polars", "database", "driver", "olap"]
classifiers = [
    "Intended Audience :: Developers",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Rust",
    "Topic :: Database",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = ["adbc-driver-manager>=1.11"]

[dependency-groups]
dev = [
    "maturin>=1.8.2,<2",
    "ruff",
    "pytest>=9",
    "pyright",
    "polars>=1.42",
    "pymonetdb>=1.9",
    "pyarrow>=25.0.0",
    "adbc-drivers-validation",
    "pandas>=3.0",
    "pandas-stubs>=3.0.3.260530",
    "sqlalchemy>=2.0",
    "cryptography>=45",
    "pyarrow-stubs>=20.0.0.20260625",
]

[project.urls]
Homepage = "https://github.com/wlaur/adbc-driver-monetdb"
Repository = "https://github.com/wlaur/adbc-driver-monetdb"
Issues = "https://github.com/wlaur/adbc-driver-monetdb/issues"

[build-system]
requires = ["maturin>=1.8.2,<2"]
build-backend = "maturin"

[tool.maturin]
# Mixed Python + Rust project: the ADBC driver cdylib (crates/adbc-monetdb) is shipped
# inside the Python package as the extension module adbc_driver_monetdb._native.
# The ADBC driver manager dlopens that file by path (see adbc_driver_monetdb.driver_path).
# The module MUST be importable as adbc_driver_monetdb: polars resolves the driver for
# monetdb:// URIs from the module name (adbc_driver_{scheme}).
manifest-path = "crates/adbc-monetdb/Cargo.toml"
python-source = "."
python-packages = ["adbc_driver_monetdb", "adbc_driver_monetdbs"]
module-name = "adbc_driver_monetdb._native"
features = ["python"]
locked = true
include = [
    { path = "rust-toolchain.toml", format = "sdist" },
    { path = "tests/**/*", format = "sdist" },
    { path = "packaging/**/*", format = "sdist" },
    { path = "compose.yaml", format = "sdist" },
]
exclude = [{ path = "**/__pycache__/**", format = "sdist" }]

[tool.cibuildwheel]
# abi3 (cp313) -> one wheel per platform covers CPython >= 3.13.
# Targets: Linux x86_64 + aarch64 (manylinux), macOS arm64 only, Windows x86_64.
build = "cp313-*"
skip = ["*-musllinux*", "*_i686", "*-win32"]
test-command = 'python -c "import adbc_driver_monetdb as m; print(m.driver_path())"'

[tool.cibuildwheel.linux]
manylinux-x86_64-image = "manylinux_2_28"
manylinux-aarch64-image = "manylinux_2_28"
# The manylinux image lacks Rust; install the current stable toolchain for maturin.
before-all = '''
rustup_machine=$(uname -m)
case "$rustup_machine" in
  x86_64)
    rustup_target=x86_64-unknown-linux-gnu
    rustup_sha256=20a06e644b0d9bd2fbdbfd52d42540bdde820ea7df86e92e533c073da0cdd43c
    ;;
  aarch64)
    rustup_target=aarch64-unknown-linux-gnu
    rustup_sha256=e3853c5a252fca15252d07cb23a1bdd9377a8c6f3efa01531109281ae47f841c
    ;;
  *)
    echo "unsupported rustup architecture: $rustup_machine" >&2
    exit 1
    ;;
esac
rustup_init=/tmp/rustup-init-1.28.2
curl --proto '=https' --tlsv1.2 -sSfL \
  "https://static.rust-lang.org/rustup/archive/1.28.2/$rustup_target/rustup-init" \
  -o "$rustup_init"
printf '%s  %s\n' "$rustup_sha256" "$rustup_init" | sha256sum --check --strict
chmod +x "$rustup_init"
"$rustup_init" -y --profile minimal --default-toolchain stable --no-modify-path
'''
before-build = '''
cargo build --locked --release -p adbc-monetdb --no-default-features
mkdir -p /output/standalone-dbc
cp target/release/libadbc_monetdb.so /output/standalone-dbc/libadbc_monetdb.so
'''
environment = { PATH = "$HOME/.cargo/bin:$PATH" }
repair-wheel-command = "auditwheel repair -w {dest_dir} {wheel}"

[tool.cibuildwheel.macos]
repair-wheel-command = "delocate-wheel --require-archs {delocate_archs} -w {dest_dir} -v {wheel}"

[tool.cibuildwheel.windows]
repair-wheel-command = "delvewheel repair -w {dest_dir} -v {wheel}"

[tool.ruff]
line-length = 120
target-version = "py313"
exclude = [".venv", "monetdb-rust", "target", "dist", "build", "**/*.pyi"]
lint.select = [
    "E",
    "W",
    "F",
    "B",
    "I",
    "N",
    "UP",
    "ANN",
    "C4",
    "ISC",
    "ICN",
    "SIM",
    "ARG",
    "PTH",
    "INT",
    "FLY",
    "RUF",
]
lint.ignore = ["ISC001"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.pyright]
include = ["adbc_driver_monetdb", "adbc_driver_monetdbs", "packaging", "tests"]
venvPath = "."
venv = ".venv"
typeCheckingMode = "strict"
reportUnnecessaryTypeIgnoreComment = "error"
useLibraryCodeForTypes = true
enableTypeIgnoreComments = false
strictListInference = true
strictDictionaryInference = true
strictSetInference = true
reportUnusedImport = false

[tool.pytest.ini_options]
addopts = "--strict-markers"
testpaths = ["tests"]
markers = [
    "integration: requires a running MonetDB server (set MONETDB_TEST_URI)",
    "local_only: manual benchmark excluded from CI (requires MONETDB_RUN_LOCAL_BENCHMARK=1)",
    "feature: validation test for an ADBC feature",
    "requires_features: validation test gated by advertised driver features",
]

[tool.uv]
override-dependencies = ["pyarrow>=25"]

[tool.uv.sources]
adbc-drivers-validation = { git = "https://github.com/adbc-drivers/validation", rev = "a4019a3f44ccffcbec4b5203531a88259d588257" }
